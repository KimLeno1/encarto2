
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Encarto - Tournament Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;700;900&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #facc15;
            --accent: #ef4444;
            --bg: #050505;
            --text: #ffffff;
            --glass: rgba(255, 255, 255, 0.03);
        }

        [data-theme='mha'] {
            --primary: #2563eb; --secondary: #facc15; --accent: #dc2626; --bg: #0f172a;
        }
        [data-theme='onepiece'] {
            --primary: #0369a1; --secondary: #fbbf24; --accent: #78350f; --bg: #0c0a09;
        }
        [data-theme='naruto'] {
            --primary: #ea580c; --secondary: #1e3a8a; --accent: #15803d; --bg: #064e3b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            transition: all 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .anime-title {
            font-family: 'Bangers', cursive;
            letter-spacing: 0.05em;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .neon-shadow {
            box-shadow: 0 0 20px var(--primary);
        }

        .rank-card {
            background: linear-gradient(135deg, var(--primary) 0%, transparent 100%);
        }

        .hall-of-fame-row:first-child {
            border-left: 4px solid var(--secondary);
            background: rgba(250, 204, 21, 0.1);
        }

        /* Mobile Adjustments */
        @media (max-width: 640px) {
            .mobile-bottom-nav {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.561.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body data-theme="mha">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
