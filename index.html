
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Encarto - Tournament Hub</title>
    <script>
      // Ignore Vite HMR WebSocket connection errors per environment constraints
      window.addEventListener('error', function(e) {
        var msg = (e && (e.message || (e.error && e.error.message))) || '';
        var src = (e && e.filename) || '';
        if (
          msg.indexOf('WebSocket') !== -1 ||
          msg.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
          src.indexOf('@vite/client') !== -1
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = (e && e.reason && (e.reason.message || String(e.reason))) || '';
        if (
          reason.indexOf('WebSocket') !== -1 ||
          reason.indexOf('createWebSocketModuleRunnerTransport') !== -1
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a855f7;
            --secondary: #38bdf8;
            --accent: #c084fc;
            --neon-blue: #22d3ee;
            --bg: #070514;
            --text: #f3f0ff;
            --glass: rgba(18, 12, 38, 0.75);
        }

        [data-theme='mha'], [data-theme='onepiece'], [data-theme='naruto'], [data-theme='encarto'] {
            --primary: #a855f7;
            --secondary: #38bdf8;
            --accent: #c084fc;
            --neon-blue: #22d3ee;
            --bg: #070514;
            --glass: rgba(18, 12, 38, 0.8);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(168, 85, 247, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(56, 189, 248, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(192, 132, 252, 0.05) 0%, transparent 60%);
            color: var(--text);
            transition: all 0.3s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .anime-title {
            font-family: 'Outfit', sans-serif;
            font-weight: 900;
            letter-spacing: 0.04em;
        }

        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .glass-panel-cyan {
            background: rgba(8, 20, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.15);
        }

        .neon-shadow {
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.45), 0 0 40px rgba(56, 189, 248, 0.2);
        }

        .neon-border-glow {
            border: 1px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3), inset 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .rank-card {
            background: linear-gradient(135deg, rgba(168, 85, 247, 0.25) 0%, rgba(56, 189, 248, 0.15) 100%);
            border: 1px solid rgba(168, 85, 247, 0.3);
        }

        .hall-of-fame-row:first-child {
            border-left: 4px solid #38bdf8;
            background: rgba(56, 189, 248, 0.12);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        /* Ambient floating stardust animation */
        @keyframes float-ethereal {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
        }

        @keyframes pulse-neon {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.6)); }
            50% { filter: drop-shadow(0 0 18px rgba(56, 189, 248, 0.8)); }
        }

        .animate-float {
            animation: float-ethereal 4s ease-in-out infinite;
        }

        .animate-neon-pulse {
            animation: pulse-neon 3s ease-in-out infinite;
        }

        /* Mobile Viewport ergonomics */
        @media (max-width: 768px) {
            .mobile-bottom-nav {
                padding-bottom: env(safe-area-inset-bottom);
            }
        }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body data-theme="mha">
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
