name: Build Encarto desktop installers

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            platform: win
            target: nsis
          - name: macOS
            os: macos-latest
            platform: mac
            target: dmg
          - name: Debian Linux
            os: ubuntu-latest
            platform: linux
            target: deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --include=optional --no-audit --no-fund
      - name: Repair missing native Rollup optional package
        run: node -e "const v=require('rollup/package.json').version; const p={'win32':'@rollup/rollup-win32-x64-msvc','darwin':'@rollup/rollup-darwin-arm64','linux':'@rollup/rollup-linux-x64-gnu'}[process.platform]; if(!p) throw new Error('Unsupported runner: '+process.platform); require('child_process').execSync('npm install --no-save --include=optional '+p+'@'+v+' --no-audit --no-fund',{stdio:'inherit'});"
      - name: Verify native Rollup package
        run: node -e "const p={'win32':'@rollup/rollup-win32-x64-msvc','darwin':'@rollup/rollup-darwin-arm64','linux':'@rollup/rollup-linux-x64-gnu'}[process.platform]; console.log(require.resolve(p));"
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/encarto_test?connect_timeout=2
        run: npm test
      - name: Type-check
        run: npm run lint
      - name: Build web frontend
        run: npm run build
      - name: Install desktop packager
        run: npm install --no-save --include=optional electron electron-builder --no-audit --no-fund
      - name: Package installer
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.target }} --publish never
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: encarto-${{ matrix.name }}-installer
          path: |
            dist-electron/*.exe
            dist-electron/*.dmg
            dist-electron/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: encarto-*-installer
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
